/* v3: live identity and opt-in stadium atmosphere, without crowding the pitch. */
.sound {width:auto;min-width:42px;gap:5px;display:inline-flex;align-items:center;justify-content:center;padding:8px;}
.sound svg {width:20px;height:20px;flex:none;}
.sound-label {font-size:11px;font-weight:600;}
.haptics-toggle {width:35px;height:39px;border:1px solid var(--line,#354347);border-radius:10px;background:transparent;color:inherit;font-size:22px;cursor:pointer;}
.haptics-toggle[aria-pressed="true"] {color:#b4decd;background:rgba(145,204,179,.09);}
.haptics-toggle:disabled {opacity:.3;cursor:default;}
.sound-opt-in {display:flex!important;align-items:center;gap:12px;padding:12px 0;border-top:1px solid rgba(240,240,220,.1);font-size:13px!important;}
.sound-opt-in input {width:20px!important;min-height:20px;height:20px;padding:0;flex:none;accent-color:#a9d3c4;}
.sound-opt-in span {display:block;line-height:1.5;}
.sound-opt-in small {display:block;color:#a7b6b0;font-size:11px;font-weight:400;}
.matchup-line {display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 17px;color:#bbc9c3;font-size:13px;}
.matchup-line strong {color:#f3efdf;font-size:16px;overflow-wrap:anywhere;}
.matchup-line>span:last-child {margin-left:auto;font-size:11px;}
.live-pill {font-size:9px;font-weight:700;letter-spacing:1px;color:#a9d3c4;background:rgba(161,216,193,.09);border:1px solid rgba(161,216,193,.25);padding:6px 8px;border-radius:5px;}
.status-dot.reconnecting {background:#e2b18e;}
.preflight-result {font-size:13px;line-height:1.7;overflow-wrap:anywhere;}
